name: Standalone Cinema bootstrap verification

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  standalone-preview:
    name: Offline-only bootstrap and route contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview-only test dependencies
        run: python -m pip install -q -r requirements-preview.txt
      - name: Compile isolated application
        run: python -m compileall -q cinema_app
      - name: Verify disabled startup and no historical media routes
        run: python -m unittest discover -s standalone_tests -v
      - name: Validate opt-in local Jellyfin Compose profile
        run: docker compose -f ops/compose.yaml --profile local-media config --quiet
      - name: Confirm no deployment entrypoint was introduced
        run: |
          test ! -f discloud.config
          test ! -f Dockerfile
          test ! -f Procfile
